[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "schedlib"
version = "0.1.0"
description = "A scheduling and date utility library for the tamandua torture-test suite"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Tamandua Torture Test Suite" }
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "flaky_probe: marks a test as a flaky probe (skipped by default, armed per scenario)",
]
