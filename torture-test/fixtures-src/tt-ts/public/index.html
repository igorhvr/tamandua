<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>Expense Tracker</h1>
  </header>

  <main id="app">
    <section id="total-display" class="total-section">
      <h2>Total Expenses</h2>
      <p id="total-amount">$0.00</p>
    </section>

    <section id="add-expense">
      <h2>Add Expense</h2>
      <form id="expense-form">
        <div class="form-group">
          <label for="description">Description</label>
          <input type="text" id="description" name="description" required placeholder="What did you spend on?">
        </div>
        <div class="form-group">
          <label for="amount">Amount</label>
          <input type="number" id="amount" name="amount" required placeholder="0.00" step="0.01" min="0">
        </div>
        <div class="form-group">
          <label for="category">Category</label>
          <select id="category" name="category" required>
            <option value="">Select category</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Utilities">Utilities</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <button type="submit">Add Expense</button>
      </form>
    </section>

    <section id="expense-list">
      <div class="list-header">
        <h2>Expenses</h2>
        <div class="filter-group">
          <label for="category-filter">Filter:</label>
          <select id="category-filter">
            <option value="">All</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Utilities">Utilities</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>
      <table id="expenses-table">
        <thead>
          <tr>
            <th>Description</th>
            <th>Amount</th>
            <th>Category</th>
            <th>Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="expenses-tbody">
        </tbody>
      </table>
      <p id="empty-message" style="display: none;">No expenses recorded yet.</p>
    </section>

    <div id="error-message" class="error" style="display: none;"></div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
