# Frontend Test Workflow — Tests the Tamandua dashboard without starting a second daemon.
id: frontend-test
name: Frontend Test
version: 1
description: |
  Builds the project and validates the dashboard frontend: HTML structure,
  required elements, API endpoint definitions, and dashboard test coverage.
  Does NOT start a second dashboard daemon (avoids killing the parent daemon).

agents:
  - id: tester
    name: Frontend Tester
    role: testing
    description: Builds and validates the Tamandua dashboard frontend source.
    workspace:
      baseDir: agents/tester
      skills:
        - tamandua-agents
      files:
        AGENTS.md: agents/tester/AGENTS.md
        SOUL.md: agents/tester/SOUL.md

steps:
  - id: test
    agent: tester
    input: |
      Validate the Tamandua dashboard frontend.

      {{task}}

      Instructions:
      1. Build the project: `./build` — this must succeed.
         If it fails, report STATUS: failed with the build error.
      2. Verify the React SPA frontend files exist and are valid:
         - Check `frontend/index.html` exists (Vite entry HTML with `<div id="root">`)
         - Check `frontend/src/main.tsx` exists (React entry point)
         - Check `frontend/src/App.tsx` exists (defines routes for `/` and `/runs/:id/kanban`)
         - Check `frontend/src/pages/Dashboard.tsx` exists
         - Check `frontend/src/pages/Kanban.tsx` exists
         - Check `frontend/vite.config.ts` exists (proxies `/api` to `http://localhost:3334`)
         - Check `frontend/dist/index.html` exists (built output)
      3. Verify dashboard route definitions in `src/server/dashboard.ts`:
         - GET `/` → React SPA (frontend/dist/index.html)
         - GET `/runs/:id/kanban` → React SPA (client-side routing)
         - GET `/api/runs` → JSON
         - GET `/api/events` → JSON
      4. Check dashboard test coverage:
         - Run `npx c8 report --reporter=text --include='dist/server/dashboard.js' 2>/dev/null` or
         - Check that `src/server/dashboard.test.ts` exists and has test cases
      5. Report results

      ⚠️ DO NOT run `tamandua dashboard start` — the dashboard is already
      running as part of the daemon that spawned this agent. Starting it again
      is unnecessary and wastes time.

      Reply with:
      STATUS: done|failed
      REPORT: detailed results of each check (pass/fail)
      CHECKS_PASSED: <N>
      CHECKS_TOTAL: <M>
    expects: "STATUS: done|failed"
    max_retries: 2
