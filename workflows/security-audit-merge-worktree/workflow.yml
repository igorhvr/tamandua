# Ralph loop (https://github.com/snarktank/ralph) — fresh context per agent session
id: security-audit-merge-worktree
name: Security Audit & Fix + Merge (Worktree)
version: 1
description: |
  Scan, prioritize, fix, and squash-merge security vulnerabilities in a worktree with automated verification.
  Worktree variant of the security vulnerability scanning and remediation pipeline
  with automatic squash-merge. Runs in a detached git worktree created from an
  origin repository.

  Scanner explores the codebase for vulnerabilities. Prioritizer ranks and groups
  findings. Setup prepares the worktree environment ({{original_branch}} is
  pre-seeded by the harness since the worktree starts detached). Fixer implements
  each fix with regression tests. Verifier confirms each fix. Tester runs final
  integration validation. Merger squash-merges the audit fixes back into the
  original branch in the origin repository.
run:
  workspace: worktree

agents:
  - id: scanner
    name: Scanner
    role: scanning
    description: Explores codebase and runs comprehensive security analysis.
    workspace:
      baseDir: agents/scanner
      skills:
        - tamandua-agents
      files:
        AGENTS.md: agents/scanner/AGENTS.md
        SOUL.md: agents/scanner/SOUL.md
        IDENTITY.md: agents/scanner/IDENTITY.md

  - id: prioritizer
    name: Prioritizer
    role: analysis
    description: Deduplicates, ranks, and groups findings into a fix plan.
    workspace:
      baseDir: agents/prioritizer
      skills:
        - tamandua-agents
      files:
        AGENTS.md: agents/prioritizer/AGENTS.md
        SOUL.md: agents/prioritizer/SOUL.md
        IDENTITY.md: agents/prioritizer/IDENTITY.md

  - id: setup
    name: Setup
    role: coding
    description: Creates security branch in the worktree, captures original branch
      from harness context, and establishes baseline.
    workspace:
      baseDir: agents/setup
      skills:
        - tamandua-agents
      files:
        AGENTS.md: ../../agents/shared/setup/AGENTS.md
        SOUL.md: ../../agents/shared/setup/SOUL.md
        IDENTITY.md: ../../agents/shared/setup/IDENTITY.md

  - id: fixer
    name: Fixer
    role: coding
    description: Implements security fixes one at a time with regression tests.
    workspace:
      baseDir: agents/fixer
      skills:
        - tamandua-agents
      files:
        AGENTS.md: agents/fixer/AGENTS.md
        SOUL.md: agents/fixer/SOUL.md
        IDENTITY.md: agents/fixer/IDENTITY.md

  - id: verifier
    name: Verifier
    role: verification
    description: Verifies each fix is correct and the vulnerability is patched.
    workspace:
      baseDir: agents/verifier
      skills:
        - tamandua-agents
      files:
        AGENTS.md: ../../agents/shared/verifier/AGENTS.md
        SOUL.md: ../../agents/shared/verifier/SOUL.md
        IDENTITY.md: ../../agents/shared/verifier/IDENTITY.md

  - id: tester
    name: Tester
    role: testing
    description: Final integration testing and audit re-run after all fixes.
    workspace:
      baseDir: agents/tester
      skills:
        - tamandua-agents
      files:
        AGENTS.md: agents/tester/AGENTS.md
        SOUL.md: agents/tester/SOUL.md
        IDENTITY.md: agents/tester/IDENTITY.md

  - id: merger
    name: Merger
    role: pr
    description: Squashes security audit branch changes and merges into the original
      branch in the origin repository.
    workspace:
      baseDir: agents/merger
      skills:
        - tamandua-agents
      files:
        AGENTS.md: agents/merger/AGENTS.md
        SOUL.md: agents/merger/SOUL.md
        IDENTITY.md: agents/merger/IDENTITY.md

steps:
  - id: scan
    agent: scanner
    input: |
      Perform a comprehensive security audit of the codebase.

      TASK:
      {{task}}

      RETRY FEEDBACK (only present if your previous attempt was rejected — read carefully and fix specifically what it complains about):
      {{retry_feedback}}

      Instructions:
      1. Explore the codebase — understand the stack, framework, dependencies
      2. Run `npm audit` (or equivalent) if a package manager is present
      3. Scan for hardcoded secrets: API keys, passwords, tokens, private keys in source
      4. Check for .env files committed to the repo
      5. Scan for common vulnerabilities:
         - SQL injection (raw queries, string concatenation in queries)
         - XSS (unescaped user input in templates/responses)
         - CSRF (missing CSRF tokens on state-changing endpoints)
         - Auth bypass (missing auth middleware, broken access control)
         - Directory traversal (user input in file paths)
         - SSRF (user-controlled URLs in server-side requests)
         - Insecure deserialization
         - Missing input validation on API endpoints
         - Insecure file permissions
         - Exposed environment variables
      6. Review auth/session handling (token expiry, session fixation, cookie flags)
      7. Check security headers (CORS, CSP, HSTS, X-Frame-Options)
      8. Document every finding with severity, file, line, and description
      9. Findings must be SECURITY issues only (injection, authz, secrets, crypto, headers, dependencies, etc.). Functional/logic bugs with no security impact must NOT be listed as findings; they may be noted in a separate notes section of the report.

      Reply with:
      STATUS: done
      REPO: /path/to/repo
      BRANCH: security-audit-YYYY-MM-DD
      VULNERABILITY_COUNT: <number>
      FINDINGS: <detailed list of each vulnerability>
    expects: "STATUS: done\nregex:^BRANCH:\\s*\\S+\nregex:^VULNERABILITY_COUNT:\\s*\\d+\nregex:^FINDINGS:\\s*\\S+"
    max_retries: 4

  - id: prioritize
    agent: prioritizer
    input: |
      Prioritize and group the security findings into a fix plan.

      TASK:
      {{task}}

      REPO: {{repo}}
      VULNERABILITY_COUNT: {{vulnerability_count}}
      FINDINGS: {{findings}}

      RETRY FEEDBACK (only present if your previous attempt was rejected — read carefully and fix specifically what it complains about):
      {{retry_feedback}}

      Instructions:
      1. Deduplicate findings (same root cause = one fix)
      2. Group related issues (e.g., multiple XSS from same missing sanitizer = one fix)
      3. Rank by: exploitability × impact (critical > high > medium > low)
      4. Create a prioritized fix plan — max 20 fixes
      5. If more than 20 issues, pick the top 20 by severity; note deferred items
      6. Output each fix as a story in STORIES_JSON format
      7. Only include SECURITY vulnerabilities in the fix plan. Non-security functional/logic bugs must not become fix stories.

      Each story object must have:
      - id: "fix-001", "fix-002", etc.
      - title: brief description of the fix
      - description: what vulnerability it addresses, affected files, what needs to change
      - acceptance_criteria: list of criteria including "Vulnerability is no longer exploitable" and "Regression test passes"
      - severity: critical|high|medium|low

      Reply with:
      STATUS: done
      FIX_PLAN: <ordered list of fixes with severity>
      CRITICAL_COUNT: <number>
      HIGH_COUNT: <number>
      DEFERRED: <any issues skipped and why>
      STORIES_JSON: [ ... array of story objects ... ]

      Malformed STORIES_JSON (fused objects, duplicate keys, invalid fields) is auto-rejected and the rejection details appear in RETRY FEEDBACK on retry — read it carefully and fix exactly what it describes.
    expects: "STATUS: done\nregex:^FIX_PLAN:\\s*\\S+\nregex:^CRITICAL_COUNT:\\s*\\d+\nregex:^HIGH_COUNT:\\s*\\d+"
    max_retries: 4

  - id: setup
    agent: setup
    input: |
      Prepare the environment for security fixes in a detached git worktree.

      REPO: {{repo}}
      BRANCH: {{branch}}
      ORIGINAL_BRANCH: {{original_branch}}
      WORKTREE_ORIGIN_REPOSITORY: {{worktree_origin_repository}}

      RETRY FEEDBACK (only present if your previous attempt was rejected — read carefully and fix specifically what it complains about):
      {{retry_feedback}}

      Instructions:
      1. cd into the repo (this is the worktree path)
      2. ORIGINAL_BRANCH is {{original_branch}} — pre-seeded by the harness since the worktree starts detached; do NOT run `git branch --show-current`
      3. Create the security branch (git checkout -b {{branch}})
      4. Read package.json, CI config, test config to understand build/test setup
      5. Ensure .gitignore exists — if missing, create one appropriate for the detected stack (must include .env, node_modules/, *.key, *.pem at minimum)
      6. Run the build to establish a baseline
      7. Run the tests to establish a baseline

      Reply with:
      STATUS: done
      ORIGINAL_BRANCH: {{original_branch}}
      BUILD_CMD: <build command>
      TEST_CMD: <test command>
      BASELINE: <baseline status>
    expects: "STATUS: done\nregex:^BUILD_CMD:\\s*\\S+\nregex:^TEST_CMD:\\s*\\S+"
    max_retries: 4
    on_fail:
      # Setup failures often originate from incomplete scanning; re-scanning refreshes vulnerability findings
      retry_step: scan

  - id: fix
    agent: fixer
    type: loop
    loop:
      over: stories
      completion: all_done
      fresh_session: true
      verify_each: true
      verify_step: verify
    input: |
      Implement a security fix. You are working on ONE fix in a fresh session.

      ## SCOPE CONTRACT — READ THIS FIRST

      You fix SECURITY vulnerabilities ONLY. NEVER fix, refactor, or "improve" non-security code you happen to notice — no logic bugs, no style issues, no typos, no dead code, no performance tweaks.

      NEVER modify existing tests to make them pass. If an existing test asserts behavior that looks wrong, it is OUT OF SCOPE — leave both the code and the test exactly as they are.

      Adding NEW tests that cover the security fix is allowed and encouraged; changing or deleting existing ones is not (unless the existing test itself directly exercises the vulnerable behavior being fixed — e.g. it asserts the shell-injection path — in which case update only that test and say so in CHANGES).

      If you notice out-of-scope problems, report them in a dedicated OUT_OF_SCOPE_NOTES section of your output instead of fixing them. This gives the "I found a bug!" impulse a safe outlet.

      TASK (overall):
      {{task}}

      REPO: {{repo}}
      BRANCH: {{branch}}
      BUILD_CMD: {{build_cmd}}
      TEST_CMD: {{test_cmd}}

      CURRENT STORY:
      {{current_story}}

      COMPLETED STORIES:
      {{completed_stories}}

      STORIES REMAINING: {{stories_remaining}}

      VERIFY FEEDBACK (if retrying):
      {{verify_feedback}}

      TIMEOUT RETRY (if previous attempt timed out):
      {{timeout_retry}}

      PROGRESS LOG:
      {{progress}}

      RETRY FEEDBACK (only present if your previous attempt was rejected — read carefully and fix specifically what it complains about):
      {{retry_feedback}}
      ## IMPORTANT — Test Command

      TEST_CMD is the exact test command to use. Copy it verbatim — do NOT substitute `npm test` or any other command you infer from the project. TEST_CMD may be wrapped in a caching shim (`tamandua-test ...`); this is intentional. If the output starts with `TAMANDUA-TEST CACHED`, the suite already passed for this exact tree — treat that as a passing test run. Only add flags through the wrapper's `--force` option when you suspect a flaky or environment-dependent result.

      Instructions:
      1. cd into the repo, pull latest on the branch
      2. Read the vulnerability description carefully
      3. Implement the fix — minimal, targeted changes only
      4. Write a regression test that verifies the vulnerability is patched
      5. Run {{build_cmd}} to verify the build passes
      6. Run {{test_cmd}} to verify all tests pass
      7. Commit: fix(security): brief description
      8. Rewrite {{progress_file}} with updated story results and patterns

      Reply with:
      STATUS: done
      CHANGES: what was fixed
      REGRESSION_TEST: what test was added
    expects: "STATUS: done\nregex:^CHANGES:\\s*\\S+\nregex:^REGRESSION_TEST:\\s*\\S+"
    max_retries: 4

  - id: verify
    agent: verifier
    input: |
      Verify the security fix is correct and the vulnerability is patched.

      REPO: {{repo}}
      BRANCH: {{branch}}
      TEST_CMD: {{test_cmd}}
      CHANGES: {{changes}}
      REGRESSION_TEST: {{regression_test}}

      CURRENT STORY:
      {{current_story}}

      PROGRESS LOG:
      {{progress}}

      RETRY FEEDBACK (only present if your previous attempt was rejected — read carefully and fix specifically what it complains about):
      {{retry_feedback}}
      ## IMPORTANT — Test Command

      TEST_CMD is the exact test command to use. Copy it verbatim — do NOT substitute `npm test` or any other command you infer from the project. TEST_CMD may be wrapped in a caching shim (`tamandua-test ...`); this is intentional. If the output starts with `TAMANDUA-TEST CACHED`, the suite already passed for this exact tree — treat that as a passing test run. Only add flags through the wrapper's `--force` option when you suspect a flaky or environment-dependent result.

      Instructions:
      0. Mechanical scope check — run `git diff --stat` (and `git diff`) between the security branch and its base. Every changed file must be justified by the security fix story being verified (the fixed source, new security tests, necessary config). If ANY change is unrelated to the security fix — especially modifications to existing tests or to code with no security relevance — respond STATUS: retry with feedback telling the fixer exactly which files/hunks to revert. Modified-existing-test is an automatic retry unless the test directly exercised the vulnerability.
      1. Run the full test suite with {{test_cmd}}
      2. Confirm the regression test exists and tests the right thing
      3. Review the fix — does it actually address the vulnerability?
      4. Check for unintended side effects
      5. Verify the regression test would fail without the fix

      Security-specific verification — think about bypass scenarios:
      - SQL Injection: Does it handle all query patterns, not just the one found?
      - XSS: Does sanitization cover all output contexts (HTML, attributes, JS, URLs)?
      - Path traversal: Does it handle URL-encoded sequences (%2e%2e), null bytes?
      - Auth bypass: Does it cover all HTTP methods (GET, POST, PUT, DELETE)?
      - CSRF: Does it validate the token server-side?
      - If the fix only blocks one payload variant, it's insufficient — STATUS: retry

      Reply with:
      STATUS: done
      VERIFIED: what was confirmed

      Or if issues found:
      STATUS: retry
      ISSUES:
      - What's wrong or incomplete
    expects: "regex:^STATUS:\\s*(done|retry)\\s*$"
    on_fail:
      retry_step: fix
      max_reroutes: 6

  - id: test
    agent: tester
    input: |
      Final integration testing after all security fixes.

      TASK:
      {{task}}

      REPO: {{repo}}
      BRANCH: {{branch}}
      BUILD_CMD: {{build_cmd}}
      TEST_CMD: {{test_cmd}}
      CHANGES: {{changes}}
      VULNERABILITY_COUNT: {{vulnerability_count}}

      PROGRESS LOG:
      {{progress}}

      RETRY FEEDBACK (only present if merger rebased the branch and needs re-validation — contains CONFLICT_NOTES describing what changed):
      {{retry_feedback}}
      ## IMPORTANT — Test Command

      TEST_CMD is the exact test command to use. Copy it verbatim — do NOT substitute `npm test` or any other command you infer from the project. TEST_CMD may be wrapped in a caching shim (`tamandua-test ...`); this is intentional. If the output starts with `TAMANDUA-TEST CACHED`, the suite already passed for this exact tree — treat that as a passing test run. Only add flags through the wrapper's `--force` option when you suspect a flaky or environment-dependent result.

      Instructions:
      0. You validate only — never edit code or tests. If the suite fails, report honestly rather than adapting tests.
      1. Run the full test suite ({{test_cmd}}) — all tests must pass
      2. Run the build ({{build_cmd}}) — must succeed
      3. Run `npm audit` (or equivalent) again — compare before/after
      4. Quick smoke test: does the app still start and work?
      5. Verify no regressions from the security fixes
      6. If retry feedback is present, the merger rebased the branch to resolve conflicts — re-validate the rebased changes listed in the feedback
      7. Summarize: what improved, what remains

      Reply with:
      STATUS: done
      RESULTS: test outcomes
      TESTED_TREE: $(git rev-parse HEAD^{tree})
      AUDIT_AFTER: remaining audit issues if any
    expects: "STATUS: done\nregex:^TESTED_TREE:\\s*\\S+"
    on_fail:
      retry_step: fix
      max_reroutes: 4

  - id: finalize_merge
    agent: merger
    input: |
      Finalize this run by squashing security audit changes into one commit and merging
      into the original branch in the origin repository. Follow the fast-forward-first
      process described in your AGENTS.md.

      RUN_ID: {{run_id}}

      TASK:
      {{task}}

      REPO: {{repo}}
      BRANCH: {{branch}}
      ORIGINAL_BRANCH: {{original_branch}}
      TESTED_TREE: {{tested_tree}}
      WORKTREE_ORIGIN_REPOSITORY: {{worktree_origin_repository}}
      ORIGIN_REPOSITORY: {{worktree_origin_repository}}

      PROGRESS LOG:
      {{progress}}

      RETRY FEEDBACK (only present if the tester re-validated a rebased branch — the tester has confirmed the rebased changes pass; proceed to Phase 3 squash merge):
      {{retry_feedback}}

      Follow the Required Process from your AGENTS.md.

      IMPORTANT — Worktree Mode: The origin working tree and index are read-only.
      Read origin refs with git -C {{worktree_origin_repository}}, but perform any
      rebase only in the security worktree at {{repo}}. The only origin ref mutation
      permitted is through tamandua merge-branch.

      Branch Existence Guard (ALWAYS FIRST):
      1. git -C {{repo}} rev-parse --verify refs/heads/{{branch}}
         - If missing, fail loudly. Never discover or substitute another branch.

      Phase 1 — Capture Explicit Origin Target + Fast-Forward Check:
      2. ORIGIN_REPOSITORY={{worktree_origin_repository}}
      3. TARGET_REF="refs/heads/{{original_branch}}"
      4. EXPECT_TIP=$(git -C "$ORIGIN_REPOSITORY" rev-parse "$TARGET_REF")
      5. git -C "$ORIGIN_REPOSITORY" merge-base --is-ancestor "$EXPECT_TIP" refs/heads/{{branch}}
         - Exit 0 (FF-safe against EXPECT_TIP): proceed to Phase 3.
         - Exit non-zero (not FF-safe): proceed to Phase 2.

      Phase 2 — Rebase Only in the Security Worktree, Then Loop Back:
      6. git -C {{repo}} rebase "$EXPECT_TIP"
      7. Fix any conflicts in {{repo}}; `git rebase --continue` until complete.
      8. After every successful rebase, even a clean one, stop before landing and reply:
         STATUS: retry
         REBASED: true
         CONFLICT_NOTES: <what changed>
         RETRY_STEP: test

      Phase 3 — Atomic Landing (Fast-Forward-Safe):
      9. Build a descriptive commit message with `fix(security):` prefix (see AGENTS.md),
         including the required co-author footer, write it to MESSAGE_FILE, then invoke exactly:
         MERGE_OUTPUT=$(tamandua merge-branch \
           --origin "$ORIGIN_REPOSITORY" \
           --branch "{{branch}}" \
           --into "{{original_branch}}" \
           --expect-tip "$EXPECT_TIP" \
           --message "$(cat "$MESSAGE_FILE")" 2>&1)
         MERGE_EXIT=$?
      10. Preserve MERGE_OUTPUT verbatim in the reply.
          - STATUS: conflicts or STATUS: target_moved maps to STATUS: retry,
            REBASED: false, CONFLICT_NOTES, and RETRY_STEP: test.
          - Any other non-zero exit maps to STATUS: failed with the exact reason.
      11. On success, compare MERGED_TREE from MERGE_OUTPUT with {{tested_tree}}.
          Fail loudly on mismatch; do not weaken this attestation.

      Reply on success with the merge-branch output verbatim, followed by:
      REBASED: false
      MERGE_COMMIT: <short form of MERGED_COMMIT>
      MERGED_INTO: {{original_branch}}
      MERGED_TREE: <verbatim MERGED_TREE from merge-branch>
      STATUS: done
    expects: |
      regex:^STATUS:\s*(done|retry)\s*$
      regex:^REBASED:\s*(true|false)\s*$
      regex:^(STATUS:\s*retry|REBASED:\s*false)\s*$
    max_retries: 0
    on_fail:
      retry_step: test
      max_reroutes: 4
      retry_on: [target_moved, conflicts]
