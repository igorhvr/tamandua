# Ralph loop (https://github.com/snarktank/ralph) — each agent runs in a fresh
# session with clean context. Memory persists via git history.
id: quarantine-broken-tests-merge
name: Quarantine Broken Tests + Merge
version: 1
description: |
  Detect failing tests, disable them minimally, iterate until the full
  test suite passes, and squash-merge the quarantined results back into
  the original branch.

  Setup prepares the environment, captures the original branch, and
  establishes the baseline. Quarantiner runs the test suite,
  identifies failing tests, disables them with the least invasive
  technique (.skip, decorator, comment), and iterates until all tests
  pass. If no failures on first run, runs a second time to catch flaky
  tests. Verifier confirms the suite is clean and only test files were
  modified. Merger squash-merges the quarantined changes back into the
  original branch.

  For the quarantine-only variant (no merge), use quarantine-broken-tests.
  For the worktree variant (isolated worktree + merge), use
  quarantine-broken-tests-merge-worktree.

agents:
  - id: setup
    name: Setup
    role: coding
    description: Prepares environment, creates branch, captures original branch,
      discovers build/test commands, establishes baseline.
    workspace:
      baseDir: agents/setup
      skills:
        - tamandua-agents
      files:
        AGENTS.md: ../../agents/shared/setup/AGENTS.md
        SOUL.md: ../../agents/shared/setup/SOUL.md
        IDENTITY.md: ../../agents/shared/setup/IDENTITY.md

  - id: quarantiner
    name: Quarantiner
    role: coding
    description: Finds failing tests and disables them minimally until the suite passes.
    workspace:
      baseDir: agents/quarantiner
      skills:
        - tamandua-agents
      files:
        AGENTS.md: agents/quarantiner/AGENTS.md
        SOUL.md: agents/quarantiner/SOUL.md
        IDENTITY.md: agents/quarantiner/IDENTITY.md

  - id: verifier
    name: Verifier
    role: verification
    description: Confirms test suite passes cleanly and only test files were modified.
    workspace:
      baseDir: agents/verifier
      skills:
        - tamandua-agents
      files:
        AGENTS.md: agents/verifier/AGENTS.md
        SOUL.md: agents/verifier/SOUL.md
        IDENTITY.md: agents/verifier/IDENTITY.md

  - id: merger
    name: Merger
    role: pr
    description: Squashes quarantine branch changes and merges into the original branch.
    workspace:
      baseDir: agents/merger
      skills:
        - tamandua-agents
      files:
        AGENTS.md: agents/merger/AGENTS.md
        SOUL.md: agents/merger/SOUL.md
        IDENTITY.md: agents/merger/IDENTITY.md

steps:
  - id: setup
    agent: setup
    input: |
      Prepare the environment for test quarantine.

      TASK:
      {{task}}

      REPO: {{repo}}
      BRANCH: {{branch}}

      RETRY FEEDBACK (only present if your previous attempt was rejected — read carefully and fix specifically what it complains about):
      {{retry_feedback}}

      Instructions:
      1. cd into the repo
      2. Capture the current branch before switching: ORIGINAL_BRANCH=$(git branch --show-current)
      3. Create the quarantine branch (git checkout -b {{branch}})
      4. Read package.json, CI config, test config to understand the build/test setup
      5. Ensure .gitignore exists — if missing, create one appropriate for the detected stack (must include .env, node_modules/, *.key, *.pem at minimum)
      6. Run the build to establish a baseline
      7. Run the tests to establish a baseline (note which tests fail — the quarantiner will handle them)
      8. Report what you found

      Reply with:
      STATUS: done
      ORIGINAL_BRANCH: <branch name captured before checkout>
      BUILD_CMD: <build command>
      TEST_CMD: <test command>
      CI_NOTES: <brief CI notes>
      BASELINE: <baseline status including test results>
    expects: "STATUS: done\nregex:^BUILD_CMD:\\s*\\S+\nregex:^TEST_CMD:\\s*\\S+"
    max_retries: 4

  - id: quarantine
    agent: quarantiner
    input: |
      Find and disable failing tests until the test suite passes.

      TASK:
      {{task}}

      REPO: {{repo}}
      BRANCH: {{branch}}
      BUILD_CMD: {{build_cmd}}
      TEST_CMD: {{test_cmd}}

      RETRY FEEDBACK (only present if your previous attempt was rejected — read carefully and fix specifically what it complains about):
      {{retry_feedback}}
      ## IMPORTANT — Test Command

      TEST_CMD is the exact test command to use. Copy it verbatim — do NOT substitute `npm test` or any other command you infer from the project. TEST_CMD may be wrapped in a caching shim (`tamandua-test ...`); this is intentional. If the output starts with `TAMANDUA-TEST CACHED`, the suite already passed for this exact tree — treat that as a passing test run. Only add flags through the wrapper's `--force` option when you suspect a flaky or environment-dependent result.

      Instructions:
      1. cd into the repo and ensure you're on {{branch}}
      2. Run {{build_cmd}} to confirm the project builds
      3. Run {{test_cmd}} and parse the output to find failing tests
      4. If zero failures on first run, run one more time to catch flaky tests
      5. For each failing test, disable it minimally (.skip, decorator, comment) — never modify or delete test logic
      6. Run {{test_cmd}} after each batch of changes
      7. Iterate until all tests pass — then run one final time to confirm stability
      8. Commit your changes: `chore: quarantine broken tests`. The commit message MUST end with: `Co-Authored-By: Tamandua <tamandua@tetradactyla.org>`

      Reply with:
      STATUS: done
      DISABLED: <count>
      FILES_CHANGED: <count>
      SUMMARY: <what was disabled and why>
    expects: "STATUS: done\nregex:^DISABLED:\\s*\\d+\nregex:^SUMMARY:\\s*\\S+"
    max_retries: 4

  - id: verify
    agent: verifier
    input: |
      Verify the quarantiner's work — confirm all tests pass and only test files were modified.

      TASK:
      {{task}}

      REPO: {{repo}}
      BRANCH: {{branch}}
      BUILD_CMD: {{build_cmd}}
      TEST_CMD: {{test_cmd}}
      DISABLED: {{disabled}}
      SUMMARY: {{summary}}

      RETRY FEEDBACK (only present if your previous attempt was rejected, or if the merger rebased the branch and needs re-validation — contains CONFLICT_NOTES describing what changed):
      {{retry_feedback}}
      ## IMPORTANT — Test Command

      TEST_CMD is the exact test command to use. Copy it verbatim — do NOT substitute `npm test` or any other command you infer from the project. TEST_CMD may be wrapped in a caching shim (`tamandua-test ...`); this is intentional. If the output starts with `TAMANDUA-TEST CACHED`, the suite already passed for this exact tree — treat that as a passing test run. Only add flags through the wrapper's `--force` option when you suspect a flaky or environment-dependent result.

      Check:
      1. Run {{build_cmd}} — build must pass
      2. Run {{test_cmd}} — all tests must pass (exit code 0)
      3. Run {{test_cmd}} a second time — confirm stability
      4. Inspect git diff — only test files modified, only skip/disable changes, no application code touched
      5. Verify each disabled test has an explanatory comment
      6. If retry feedback is present, the merger rebased the branch to resolve conflicts — re-validate the rebased changes listed in the feedback

      Reply with:
      STATUS: done
      VERIFIED: What you confirmed
      TESTED_TREE: $(git rev-parse HEAD^{tree})
    expects: "STATUS: done\nregex:^VERIFIED:\\s*\\S+\nregex:^TESTED_TREE:\\s*\\S+"
    on_fail:
      retry_step: quarantine
      max_reroutes: 4

  - id: finalize_merge
    agent: merger
    input: |
      Finalize this run by squashing quarantine changes into one commit and merging
      into the original branch. Follow the fast-forward-first process described
      in your AGENTS.md.

      RUN_ID: {{run_id}}

      TASK:
      {{task}}

      REPO: {{repo}}
      BRANCH: {{branch}}
      ORIGINAL_BRANCH: {{original_branch}}
      ORIGIN_REPOSITORY: {{repo}}

      DISABLED: {{disabled}}
      SUMMARY: {{summary}}
      TESTED_TREE: {{tested_tree}}

      RETRY FEEDBACK (only present if the verifier re-validated a rebased branch — the branch was rebased; revalidation happens via the verifier reroute):
      {{retry_feedback}}

      Follow the Required Process from your AGENTS.md. The origin working tree
      and index are read-only; only tamandua merge-branch may mutate its target ref.

      Branch Existence Guard (ALWAYS FIRST):
      1. git -C {{repo}} rev-parse --verify refs/heads/{{branch}}
         - If missing, fail loudly. Never discover or substitute another branch.

      Phase 1 — Capture Explicit Target + Fast-Forward Check:
      2. ORIGIN_REPOSITORY={{repo}}
      3. TARGET_REF="refs/heads/{{original_branch}}"
      4. EXPECT_TIP=$(git -C "$ORIGIN_REPOSITORY" rev-parse "$TARGET_REF")
      5. git -C "$ORIGIN_REPOSITORY" merge-base --is-ancestor "$EXPECT_TIP" refs/heads/{{branch}}
         - Exit 0 (FF-safe against EXPECT_TIP): proceed to Phase 3.
         - Exit non-zero (not FF-safe): proceed to Phase 2.

      Phase 2 — Rebase in the Quarantine Workspace, Then Loop Back:
      6. git -C {{repo}} rebase "$EXPECT_TIP"
      7. Fix any conflicts in {{repo}}; `git rebase --continue` until complete.
      8. After every successful rebase, even a clean one, stop before landing and reply:
         STATUS: retry
         REBASED: true
         CONFLICT_NOTES: <what changed>
         RETRY_STEP: verify

      Phase 3 — Atomic Landing (Fast-Forward-Safe):
      9. Build a descriptive commit message (see AGENTS.md), including the required
         co-author footer, write it to MESSAGE_FILE, then invoke exactly:
         MERGE_OUTPUT=$(tamandua merge-branch \
           --origin "$ORIGIN_REPOSITORY" \
           --branch "{{branch}}" \
           --into "{{original_branch}}" \
           --expect-tip "$EXPECT_TIP" \
           --message "$(cat "$MESSAGE_FILE")" 2>&1)
         MERGE_EXIT=$?
      10. Preserve MERGE_OUTPUT verbatim in the reply.
          - STATUS: conflicts or STATUS: target_moved maps to STATUS: retry,
            REBASED: false, CONFLICT_NOTES, and RETRY_STEP: verify.
          - Any other non-zero exit maps to STATUS: failed with the exact reason.
      11. On success, compare MERGED_TREE from MERGE_OUTPUT with {{tested_tree}}.
          Fail loudly on mismatch; do not weaken this attestation.

      Reply on success with the merge-branch output verbatim, followed by:
      REBASED: false
      MERGE_COMMIT: <short form of MERGED_COMMIT>
      MERGED_INTO: {{original_branch}}
      MERGED_TREE: <verbatim MERGED_TREE from merge-branch>
      STATUS: done
    expects: |
      regex:^STATUS:\s*(done|retry)\s*$
      regex:^REBASED:\s*(true|false)\s*$
      regex:^(STATUS:\s*retry|REBASED:\s*false)\s*$
    max_retries: 0
    on_fail:
      retry_step: verify
      max_reroutes: 4
      retry_on: [target_moved, conflicts]
