# Ralph loop (https://github.com/snarktank/ralph) — each agent runs in a fresh
# session with clean context. Memory persists via git history and progress files.
id: feature-dev-merge-worktree
name: Feature Development + Merge Workflow (Worktree)
version: 1
description: |
  Plan, implement, test, and squash-merge features story-by-story in a worktree with automated verification.
  Worktree variant of the story-based execution pipeline for local-only repos.
  Runs in a detached git worktree created from an origin repository.

  Planner decomposes tasks into user stories. Setup prepares the worktree
  environment ({{original_branch}} is pre-seeded by the harness since the
  worktree starts detached). Developer implements each story (with tests) in
  a fresh session. Verifier checks each story.

  After integration/E2E testing, the workflow performs a final squash merge
  in the origin repository: all workflow branch changes are squashed into one
  commit and merged back into the original branch.
run:
  workspace: worktree

agents:
  - id: planner
    name: Planner
    role: analysis
    description: Decomposes tasks into ordered user stories.
    workspace:
      baseDir: agents/planner
      skills:
        - tamandua-agents
      files:
        AGENTS.md: agents/planner/AGENTS.md
        SOUL.md: agents/planner/SOUL.md
        IDENTITY.md: agents/planner/IDENTITY.md

  - id: setup
    name: Setup
    role: coding
    description: Prepares environment, creates branch, establishes baseline.
    workspace:
      baseDir: agents/setup
      skills:
        - tamandua-agents
      files:
        AGENTS.md: ../../agents/shared/setup/AGENTS.md
        SOUL.md: ../../agents/shared/setup/SOUL.md
        IDENTITY.md: ../../agents/shared/setup/IDENTITY.md

  - id: developer
    name: Developer
    role: coding
    description: Implements features and writes tests.
    workspace:
      baseDir: agents/developer
      skills:
        - tamandua-agents
      files:
        AGENTS.md: agents/developer/AGENTS.md
        SOUL.md: agents/developer/SOUL.md
        IDENTITY.md: agents/developer/IDENTITY.md

  - id: verifier
    name: Verifier
    role: verification
    description: Quick sanity check - did developer actually do the work?
    workspace:
      baseDir: agents/verifier
      skills:
        - agent-browser
        - tamandua-agents
      files:
        AGENTS.md: ../../agents/shared/verifier/AGENTS.md
        SOUL.md: ../../agents/shared/verifier/SOUL.md
        IDENTITY.md: ../../agents/shared/verifier/IDENTITY.md

  - id: tester
    name: Tester
    role: testing
    description: Integration and E2E testing after all stories are implemented.
    workspace:
      baseDir: agents/tester
      skills:
        - tamandua-agents
      files:
        AGENTS.md: agents/tester/AGENTS.md
        SOUL.md: agents/tester/SOUL.md
        IDENTITY.md: agents/tester/IDENTITY.md

  - id: merger
    name: Merger
    role: pr
    description: Squashes workflow branch changes and merges into the original
      branch in the origin repository.
    workspace:
      baseDir: agents/merger
      skills:
        - tamandua-agents
      files:
        AGENTS.md: agents/merger/AGENTS.md
        SOUL.md: agents/merger/SOUL.md
        IDENTITY.md: agents/merger/IDENTITY.md

steps:
  - id: plan
    agent: planner
    input: |
      Decompose the following task into ordered user stories for autonomous execution.

      TASK:
      {{task}}

      RETRY FEEDBACK (only present if your previous attempt was rejected — read carefully and fix specifically what it complains about):
      {{retry_feedback}}

      RETRY FEEDBACK (only present if your previous attempt was rejected — read carefully and fix specifically what it complains about):
      {{retry_feedback}}

      Instructions:
      1. Explore the codebase to understand the stack, conventions, and patterns
      2. Break the task into small user stories (max 20)
      3. Order by dependency: schema/DB first, backend, frontend, integration
      4. Each story must fit in one developer session (one context window)
      5. Every acceptance criterion must be mechanically verifiable
      6. Always include "Typecheck passes" as the last criterion in every story
      7. Every story MUST include test criteria — "Tests for [feature] pass"
      8. The developer is expected to write tests as part of each story

      Reply with:
      STATUS: done
      REPO: /path/to/repo
      BRANCH: <new-feature-branch-name to create for this run, e.g. feature/short-description — MUST be a fresh, descriptive name; MUST NOT be a default/integration branch like main, master, trunk, develop, dev, or release; the setup step will `git checkout -b` this name and the finalize_merge step squashes it back into the original branch>
      STORIES_JSON: [ ... array of story objects ... ]

      The STORIES_JSON line is REQUIRED and MUST be a literal JSON array on a single line with no line breaks inside the JSON array. Example (illustrative — produce real stories for the actual TASK, not these):
      STORIES_JSON: [{"id":"US-001","title":"Add foo column","description":"...","acceptanceCriteria":["foo exists","tests pass","Typecheck passes"]}]

      ⚠️ ANTI-PATTERNS — DO NOT DO:
      - Do NOT use triple backticks (```) around STORIES_JSON
      - Do NOT add comments inside the JSON
      - Do NOT put any text after the closing ] on the STORIES_JSON line

      Without STORIES_JSON the run cannot proceed; do not summarize stories in prose under CHANGES — only the literal STORIES_JSON line is parsed.

      Malformed STORIES_JSON (fused objects, duplicate keys, invalid fields) is auto-rejected and the rejection details appear in RETRY FEEDBACK on retry — read it carefully and fix exactly what it describes.
    expects: "STATUS: done\nregex:^BRANCH:\\s*\\S+"
    max_retries: 4

  - id: setup
    agent: setup
    input: |
      Prepare the development environment for this feature in a detached git worktree.

      TASK:
      {{task}}

      REPO: {{repo}}
      BRANCH: {{branch}}
      ORIGINAL_BRANCH: {{original_branch}}
      WORKTREE_ORIGIN_REPOSITORY: {{worktree_origin_repository}}

      RETRY FEEDBACK (only present if your previous attempt was rejected — read carefully and fix specifically what it complains about):
      {{retry_feedback}}

      Instructions:
      1. cd into the repo (this is the worktree path)
      2. ORIGINAL_BRANCH is {{original_branch}} — pre-seeded by the harness since the worktree starts detached; do NOT run `git branch --show-current`
      3. Create the feature branch (git checkout -b {{branch}})
      4. Read package.json, CI config, test config to understand the build/test setup
      5. Ensure .gitignore exists — if missing, create one appropriate for the detected stack (must include .env, node_modules/, *.key, *.pem at minimum)
      6. Run the build to establish a baseline
      7. Run the tests to establish a baseline
      8. Report what you found

      Reply with:
      STATUS: done
      ORIGINAL_BRANCH: {{original_branch}}
      BUILD_CMD: <build command>
      TEST_CMD: <test command>
      CI_NOTES: <brief CI notes>
      BASELINE: <baseline status>
    expects: "STATUS: done\nregex:^BUILD_CMD:\\s*\\S+\nregex:^TEST_CMD:\\s*\\S+"
    max_retries: 4
    on_fail:
      # Setup failures often originate from an incomplete plan; re-planning refreshes understanding of the codebase
      retry_step: plan

  - id: implement
    agent: developer
    type: loop
    loop:
      over: stories
      completion: all_done
      fresh_session: true
      verify_each: true
      verify_step: verify
    input: |
      Implement the following user story. You are working on ONE story in a fresh session.

      TASK (overall):
      {{task}}

      REPO: {{repo}}
      BRANCH: {{branch}}
      BUILD_CMD: {{build_cmd}}
      TEST_CMD: {{test_cmd}}

      CURRENT STORY:
      {{current_story}}

      COMPLETED STORIES:
      {{completed_stories}}

      STORIES REMAINING: {{stories_remaining}}

      VERIFY FEEDBACK (if retrying):
      {{verify_feedback}}

      TIMEOUT RETRY (if previous attempt timed out):
      {{timeout_retry}}

      PROGRESS LOG:
      {{progress}}

      RETRY FEEDBACK (only present if your previous attempt was rejected — read carefully and fix specifically what it complains about):
      {{retry_feedback}}
      ## IMPORTANT — Test Command

      TEST_CMD is the exact test command to use. Copy it verbatim — do NOT substitute `npm test` or any other command you infer from the project. TEST_CMD may be wrapped in a caching shim (`tamandua-test ...`); this is intentional. If the output starts with `TAMANDUA-TEST CACHED`, the suite already passed for this exact tree — treat that as a passing test run. Only add flags through the wrapper's `--force` option when you suspect a flaky or environment-dependent result.

      Instructions:
      1. Read {{progress_file}} — especially the Codebase Patterns section
      2. Pull latest on the branch
      3. Implement this story only
      4. Write tests for this story's functionality
      5. Run typecheck / build
      6. Run tests to confirm they pass
      7. Commit: feat: {{current_story_id}} - {{current_story_title}}
      8. Rewrite {{progress_file}} with updated story results and patterns
      9. Update Codebase Patterns if you found reusable patterns

      Reply with:
      STATUS: done
      CHANGES: what you implemented
      TESTS: what tests you wrote
    expects: "STATUS: done\nregex:^CHANGES:\\s*\\S+"
    max_retries: 4

  - id: verify
    agent: verifier
    input: |
      Verify the developer's work on this story.

      TASK (overall):
      {{task}}

      REPO: {{repo}}
      BRANCH: {{branch}}
      CHANGES: {{changes}}
      TEST_CMD: {{test_cmd}}

      CURRENT STORY:
      {{current_story}}

      PROGRESS LOG:
      {{progress}}
      ## IMPORTANT — Test Command

      TEST_CMD is the exact test command to use. Copy it verbatim — do NOT substitute `npm test` or any other command you infer from the project. TEST_CMD may be wrapped in a caching shim (`tamandua-test ...`); this is intentional. If the output starts with `TAMANDUA-TEST CACHED`, the suite already passed for this exact tree — treat that as a passing test run. Only add flags through the wrapper's `--force` option when you suspect a flaky or environment-dependent result.

      Check:
      1. Code exists (not just TODOs or placeholders)
      2. Each acceptance criterion for the story is met
      3. Tests were written for this story's functionality
      4. Tests pass (run {{test_cmd}})
      5. No obvious incomplete work
      6. Typecheck passes

      ## Visual Verification (Frontend Changes)
      Has frontend changes: {{has_frontend_changes}}

      If {{has_frontend_changes}} is 'true', you MUST also perform visual verification:
      1. Use the agent-browser skill to visually inspect the changed UI
      2. Open the changed HTML file directly (file:// URL) or spin up a local dev server if the project requires one
      3. Take a screenshot of the rendered page
      4. Visually confirm:
         - Layout renders correctly (no broken/overlapping elements)
         - Styling is applied as expected (colors, fonts, spacing)
         - All visible elements from the story are present and properly positioned
         - No missing images, icons, or visual assets
         - Text is readable and not clipped or hidden
      5. A visual PASS means: the page renders without broken layout, missing elements, or overlapping content
      6. A visual FAIL means: broken layout, missing/invisible elements, overlapping or misaligned content, unstyled raw HTML, or obvious rendering errors
      7. Include your visual findings in VERIFIED output

      If {{has_frontend_changes}} is 'false', skip visual verification entirely.

      RETRY FEEDBACK (only present if your previous attempt was rejected — read carefully and fix specifically what it complains about):
      {{retry_feedback}}

      Reply with:
      STATUS: done
      VERIFIED: What you confirmed

      Or if incomplete:
      STATUS: retry
      ISSUES:
      - What's missing or incomplete
    expects: "regex:^STATUS:\\s*(done|retry)\\s*$"
    on_fail:
      retry_step: implement
      max_retries: 4

  - id: test
    agent: tester
    input: |
      Integration and E2E testing of the implementation.

      TASK:
      {{task}}

      REPO: {{repo}}
      BRANCH: {{branch}}
      CHANGES: {{changes}}
      BUILD_CMD: {{build_cmd}}
      TEST_CMD: {{test_cmd}}

      PROGRESS LOG:
      {{progress}}

      RETRY FEEDBACK (only present if the merger rebased the branch and needs re-validation — contains CONFLICT_NOTES describing what changed):
      {{retry_feedback}}
      ## IMPORTANT — Test Command

      TEST_CMD is the exact test command to use. Copy it verbatim — do NOT substitute `npm test` or any other command you infer from the project. TEST_CMD may be wrapped in a caching shim (`tamandua-test ...`); this is intentional. If the output starts with `TAMANDUA-TEST CACHED`, the suite already passed for this exact tree — treat that as a passing test run. Only add flags through the wrapper's `--force` option when you suspect a flaky or environment-dependent result.

      Your job (integration/E2E testing — unit tests were already written per-story):
      1. Run the full test suite ({{test_cmd}}) to confirm everything passes together
      2. Look for integration issues between stories
      3. If this is a UI feature, use agent-browser to test it end-to-end
      4. Check cross-cutting concerns: error handling, edge cases across features
      5. Verify the overall feature works as a cohesive whole
      6. If retry feedback is present, the merger rebased the branch to resolve conflicts — re-validate the rebased changes listed in the feedback

      Reply with:
      STATUS: done
      RESULTS: What you tested and the outcomes
      TESTED_TREE: $(git rev-parse HEAD^{tree})
    expects: "STATUS: done\nregex:^TESTED_TREE:\\s*\\S+"
    on_fail:
      retry_step: implement
      max_retries: 4

  - id: finalize_merge
    agent: merger
    input: |
      Finalize this run by squashing workflow changes into one commit and merging
      into the original branch in the origin repository. Follow the fast-forward-first
      process described in your AGENTS.md.

      RUN_ID: {{run_id}}

      TASK:
      {{task}}

      REPO: {{repo}}
      BRANCH: {{branch}}
      ORIGINAL_BRANCH: {{original_branch}}
      TESTED_TREE: {{tested_tree}}
      WORKTREE_ORIGIN_REPOSITORY: {{worktree_origin_repository}}
      ORIGIN_REPOSITORY: {{worktree_origin_repository}}

      PROGRESS LOG:
      {{progress}}

      RETRY FEEDBACK (only present if the tester re-validated a rebased branch — the tester has confirmed the rebased changes pass; proceed to Phase 3 squash merge):
      {{retry_feedback}}

      Follow the Required Process from your AGENTS.md.

      IMPORTANT — Worktree Mode: The origin working tree and index are read-only.
      Read origin refs with git -C {{worktree_origin_repository}}, but perform any
      rebase only in the feature worktree at {{repo}}. The only origin ref mutation
      permitted is through tamandua merge-branch.

      Branch Existence Guard (ALWAYS FIRST):
      1. git -C {{repo}} rev-parse --verify refs/heads/{{branch}}
         - If missing, fail loudly. Never discover or substitute another branch.

      Phase 1 — Capture Explicit Origin Target + Fast-Forward Check:
      2. ORIGIN_REPOSITORY={{worktree_origin_repository}}
      3. TARGET_REF="refs/heads/{{original_branch}}"
      4. EXPECT_TIP=$(git -C "$ORIGIN_REPOSITORY" rev-parse "$TARGET_REF")
      5. git -C "$ORIGIN_REPOSITORY" merge-base --is-ancestor "$EXPECT_TIP" refs/heads/{{branch}}
         - The target comes exclusively from {{original_branch}}; never assume main.
         - Exit 0 (FF-safe against EXPECT_TIP): proceed to Phase 3.
         - Exit non-zero (not FF-safe): proceed to Phase 2.

      Phase 2 — Rebase Only in the Feature Worktree, Then Loop Back:
      6. git -C {{repo}} rebase "$EXPECT_TIP"
      7. Fix any conflicts in {{repo}}; `git rebase --continue` until complete.
      8. After every successful rebase, even a clean one, stop before landing and reply:
         STATUS: retry
         REBASED: true
         CONFLICT_NOTES: <what changed>
         RETRY_STEP: test

      Phase 3 — Atomic Landing (Fast-Forward-Safe):
      9. Build a descriptive commit message (see AGENTS.md), including the required
         co-author footer, write it to MESSAGE_FILE, then invoke exactly:
         MERGE_OUTPUT=$(tamandua merge-branch \
           --origin "$ORIGIN_REPOSITORY" \
           --branch "{{branch}}" \
           --into "{{original_branch}}" \
           --expect-tip "$EXPECT_TIP" \
           --message "$(cat "$MESSAGE_FILE")")
         MERGE_EXIT=$?
      10. Preserve MERGE_OUTPUT verbatim in the reply.
          - STATUS: conflicts or STATUS: target_moved maps to STATUS: retry,
            REBASED: false, CONFLICT_NOTES, and RETRY_STEP: test.
          - Any other non-zero exit maps to STATUS: failed with the exact reason.
      11. On success, compare MERGED_TREE from MERGE_OUTPUT with {{tested_tree}}.
          Fail loudly on mismatch; do not weaken this attestation.

      Reply on success with the merge-branch output verbatim, followed by:
      REBASED: false
      MERGE_COMMIT: <short form of MERGED_COMMIT>
      MERGED_INTO: {{original_branch}}
      MERGED_TREE: <verbatim MERGED_TREE from merge-branch>
      STATUS: done
    expects: |
      regex:^STATUS:\s*(done|retry)\s*$
      regex:^REBASED:\s*(true|false)\s*$
      regex:^(STATUS:\s*retry|REBASED:\s*false)\s*$
    max_retries: 0
    on_fail:
      retry_step: test
      max_reroutes: 8
